<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOELL SHOP · Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="payment.css">
</head>
<body>
<canvas id="particlesCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>

<div class="app-container">
    <header class="top-header">
        <div class="logo-area" id="logoArea">
            <img src="https://files.catbox.moe/ijemcy.png" alt="logo" loading="lazy">
            <span>JOELL SHOP</span>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
            <button class="header-btn" onclick="window.location.href='index.html'"><i class="fas fa-home"></i></button>
        </div>
    </header>

    <div class="admin-page active" id="page-admin">
        <div id="adminLoginView">
            <div class="admin-login-box">
                <div style="font-size:3rem;color:var(--accent-light);margin-bottom:8px;"><i class="fas fa-shield-alt"></i></div>
                <h2>Admin Panel</h2>
                <p>Masukkan password untuk mengakses dashboard admin</p>
                <input type="password" id="adminPasswordInput" placeholder="••••••••">
                <button id="adminLoginBtn"><i class="fas fa-lock"></i> Masuk Admin</button>
                <button id="adminBackBtn" style="margin-top:12px;background:transparent;color:var(--text-muted);border:1px solid var(--border-subtle);">Kembali ke Toko</button>
            </div>
        </div>
        <div id="adminDashboardView" style="display:none;">
            <div class="tracking-detail-box" style="margin-bottom:16px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                    <div>
                        <h2><i class="fas fa-shield-alt" style="color:var(--accent-light);"></i> Admin Dashboard</h2>
                        <p class="subtitle">Kelola pesanan dan chat pelanggan</p>
                    </div>
                    <button onclick="refreshAdminOrders()" class="header-btn"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
            <div class="admin-stats-grid">
                <div class="admin-stat-card"><div class="num" id="adminStatTotal">0</div><div class="label">Total Pesanan</div></div>
                <div class="admin-stat-card"><div class="num" id="adminStatPending">0</div><div class="label">Menunggu</div></div>
                <div class="admin-stat-card"><div class="num" id="adminStatProcessing">0</div><div class="label">Diproses</div></div>
                <div class="admin-stat-card"><div class="num" id="adminStatCompleted">0</div><div class="label">Selesai</div></div>
            </div>
            <div class="admin-section">
                <h3><i class="fas fa-shopping-bag"></i> Semua Pesanan</h3>
                <div id="adminOrdersList"></div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Theme toggle
        document.getElementById('themeToggle').addEventListener('click', function() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('joellTheme', next);
            this.querySelector('i').className = next === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        });

        // Admin login
        const isLoggedIn = sessionStorage.getItem('joellAdminLoggedIn') === 'true';
        if (isLoggedIn) {
            document.getElementById('adminLoginView').style.display = 'none';
            document.getElementById('adminDashboardView').style.display = 'block';
            refreshAdminOrders();
        }

        document.getElementById('adminLoginBtn').addEventListener('click', function() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === 'admin123') {
                sessionStorage.setItem('joellAdminLoggedIn', 'true');
                document.getElementById('adminLoginView').style.display = 'none';
                document.getElementById('adminDashboardView').style.display = 'block';
                refreshAdminOrders();
                showToast('✅ Login Berhasil', 'Selamat datang Admin', 'success');
            } else {
                showToast('❌ Password Salah', 'Coba lagi', 'error');
            }
        });

        document.getElementById('adminBackBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });

        // Load theme
        const savedTheme = localStorage.getItem('joellTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const icon = document.querySelector('#themeToggle i');
        if (icon) icon.className = savedTheme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
    });
</script>
</body>
</html>
